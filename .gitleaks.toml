# Gitleaks-Konfiguration (security/hardening)
# Übernimmt alle Standardregeln. Ausnahme: der Web3Forms-Access-Key ist laut
# Web3Forms für den Einsatz im Browser gedacht und damit kein Geheimnis
# (siehe SECURITY_AUDIT_REPORT.md, Fund F-03). Er wird nur in diesen zwei
# Dateien ignoriert – überall sonst schlägt der Scan weiterhin an.
[extend]
useDefault = true

[allowlist]
description = "Öffentlicher Web3Forms-Access-Key (by design im Browser sichtbar)"
paths = [
  '''^form-config\.js$''',
  '''^public/scripts/form-config\.js$''',
]

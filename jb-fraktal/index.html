<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const stage = $('#stage'), canvas = $('#cv'), hud = $('#hud'), prog = $('#prog'), dock = $('#dock');

/* ------------------------------------------------------------------ *
 *  Festkomma-Arithmetik (BigInt) für die Referenzbahn
 *  Alle Koordinaten: ganze Zahl × 2^-256
 * ------------------------------------------------------------------ */
const FS = 256, FSB = 256n, P256 = Math.pow(2, -FS);
const f64 = new Float64Array(1), u64 = new BigUint64Array(f64.buffer);
function dblToFixed(v) {
    if (v === 0 || !isFinite(v)) return 0n;
    f64[0] = v;
    const b = u64[0], neg = (b >> 63n) === 1n, e = Number((b >> 52n) & 0x7ffn);
    let m = b & 0xfffffffffffffn, ex;
    if (e === 0) ex = -1074; else { m |= 1n << 52n; ex = e - 1075; }
    const sh = ex + FS;
    const r = sh >= 0 ? m << BigInt(sh) : m >> BigInt(-sh);
    return neg ? -r : r;
}
function decToFixed(str) {
    str = String(str).trim();
    let neg = false;
    if (str[0] === '-') { neg = true; str = str.slice(1); } else if (str[0] === '+') str = str.slice(1);
    const [ip, fp = ''] = str.split('.');
    const d = fp.length;
    const num = BigInt((ip || '0') + fp);
    const r = (num << FSB) / (10n ** BigInt(d));
    return neg ? -r : r;
}
function fixedToDec(v, digits) {
    const neg = v < 0n; if (neg) v = -v;
    const n = (v * (10n ** BigInt(digits))) >> FSB;
    const s = n.toString().padStart(digits + 1, '0');
    const out = s.slice(0, s.length - digits) + '.' + s.slice(s.length - digits);
    return (neg ? '-' : '') + out;
}
function buildOrbit(cx, cy, F, cap) {
    const FB = BigInt(F), F1 = FB - 1n;
    const out = new Float32Array((cap + 1) * 2);
    const LIM = 1000000n << FB, sc = Math.pow(2, -F);
    let x = 0n, y = 0n, len = cap + 1;
    for (let n = 1; n <= cap; n++) {
        const xx = (x * x) >> FB, yy = (y * y) >> FB;
        if (n > 1 && xx + yy > LIM) { len = n; break; }
        const xy = (x * y) >> F1;
        x = xx - yy + cx; y = xy + cy;
        out[2 * n] = Number(x) * sc; out[2 * n + 1] = Number(y) * sc;
    }
    return { data: out, len };
}

/* ------------------------------------------------------------------ *
 *  Zustand
 * ------------------------------------------------------------------ */
const MAXZ = 1e28, MINZ = 0.7, MAXIT = 24000;
const store = {
    get(k, d) { try { const v = localStorage.getItem('jbf-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('jbf-' + k, JSON.stringify(v)); } catch (e) {} }
};
const S = {
    ref: [0n, 0n], off: [0, 0], zoom: 1,
    refBits: 96, orbitCap: 0, orbitLen: 1, lockRef: false,
    pal: store.get('pal', 0), dens: store.get('dens', 0.5), rel: store.get('rel', 0.45), cyc: store.get('cyc', 0),
    det: store.get('det', 1), aa: store.get('aa', true), shift: 0
};
const HOME = { re: -0.5, im: 0 };

const PALS = [
    { n: 'Glut',       a: [.5, .5, .5], b: [.5, .5, .5], c: [1, 1, .5], d: [.8, .9, .3], in: [.02, .01, .02] },
    { n: 'Eis',        a: [.5, .6, .72], b: [.42, .38, .3], c: [1, 1, 1], d: [.55, .6, .7], in: [.01, .02, .05] },
    { n: 'Gold',       a: [.55, .42, .2], b: [.45, .38, .22], c: [1, 1, 1], d: [0, .12, .25], in: [.03, .02, .01] },
    { n: 'Regenbogen', a: [.5, .5, .5], b: [.5, .5, .5], c: [1, 1, 1], d: [0, .33, .67], in: [.03, .03, .04] },
    { n: 'Neon',       a: [.5, .5, .5], b: [.5, .5, .5], c: [2, 1, 0], d: [.5, .2, .25], in: [.02, .02, .03] },
    { n: 'Rot',        a: [.5, .12, .12], b: [.5, .12, .12], c: [1, 1, 1], d: [0, .1, .1], in: [.0, .0, .0] }
];

/* ------------------------------------------------------------------ *
 *  WebGL
 * ------------------------------------------------------------------ */
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
function fail(msg) { $('#fbmsg').textContent = msg; $('#fallback').hidden = false; }
if (!gl) { fail('Dieser Browser kann WebGL 2 nicht nutzen.'); return; }
const extF = gl.getExtension('EXT_color_buffer_float');
const extH = gl.getExtension('EXT_color_buffer_half_float');
if (!extF && !extH) { fail('Dieses Gerät kann keine Fliesskomma-Texturen rendern.'); return; }
const FMT = extF
    ? { internal: gl.R32F, format: gl.RED, type: gl.FLOAT }
    : { internal: gl.R16F, format: gl.RED, type: gl.HALF_FLOAT };

const VS = `#version 300 es
void main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

const FS_ITER = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uniform sampler2D uOrbit;
uniform vec2 uRes, uOffPix;
uniform float uS;
uniform int uMaxIter, uRefLen, uProbe;
out vec4 outColor;
vec2 cmul(vec2 a, vec2 b){ return vec2(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x); }
vec2 orb(int n){ return texelFetch(uOrbit, ivec2(n & 2047, n >> 11), 0).rg; }
void main(){
    vec2 dcp = gl_FragCoord.xy - 0.5 * uRes + uOffPix;
    vec2 w = vec2(0.0);
    int n = 0, glitch = 0, iters = uMaxIter;
    float res = -1.0;
    for (int i = 0; i < uMaxIter; i++) {
        vec2 Zn = orb(n);
        vec2 q = uS * w;
        vec2 z = Zn + q;
        bool atEnd = n >= uRefLen - 1;
        if (atEnd || (n > 0 && max(abs(z.x), abs(z.y)) < max(abs(q.x), abs(q.y)))) {
            if (atEnd) glitch = 1;
            w = z / uS; n = 0; Zn = vec2(0.0); q = z;
        }
        w = 2.0 * cmul(Zn, w) + cmul(q, w) + dcp;
        n++;
        vec2 zn = orb(n) + uS * w;
        float zz = dot(zn, zn);
        if (zz > 65536.0) { res = float(i) + 2.0 - log2(log2(zz)); iters = i; break; }
    }
    if (uProbe == 1) { outColor = vec4(float(glitch), float(iters) / float(uMaxIter), res < 0.0 ? 0.0 : 1.0, 1.0); return; }
    outColor = vec4(res < 0.0 ? -1.0 : log2(max(res, 0.0) + 1.0), 0.0, 0.0, 1.0);
}`;

const FS_COLOR = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uniform sampler2D uLow, uHi;
uniform vec2 uOutSize, uLowSize, uHiSize;
uniform int uSS, uHiOn;
uniform vec3 uPA, uPB, uPC, uPD, uInside;
uniform float uDens, uShift, uRel;
out vec4 o;
vec3 pal(float lt){ float t = lt * uDens + uShift; return clamp(uPA + uPB * cos(6.28318530718 * (uPC * t + uPD)), 0.0, 1.0); }
float L(sampler2D tx, ivec2 sz, ivec2 p){ return texelFetch(tx, clamp(p, ivec2(0), sz - 1), 0).r; }
vec3 colAt(sampler2D tx, ivec2 sz, ivec2 p, float v){
    if (v < -0.5) return uInside;
    vec3 c = pal(v);
    if (uRel > 0.001) {
        float a = L(tx, sz, p + ivec2(1, 0)), b = L(tx, sz, p - ivec2(1, 0));
        float cc = L(tx, sz, p + ivec2(0, 1)), d = L(tx, sz, p - ivec2(0, 1));
        if (a < -0.5) a = v; if (b < -0.5) b = v; if (cc < -0.5) cc = v; if (d < -0.5) d = v;
        float k = dot(vec2(a - b, cc - d) * 0.5, vec2(-0.7071, 0.7071));
        c *= 1.0 + uRel * clamp(k * 2.4, -0.55, 0.55);
    }
    return c;
}
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main(){
    ivec2 px = ivec2(gl_FragCoord.xy);
    vec3 col = vec3(0.0);
    bool useLow = true;
    if (uHiOn == 1) {
        ivec2 hs = ivec2(uHiSize);
        vec3 acc = vec3(0.0); bool ok = true;
        for (int j = 0; j < 2; j++) for (int i = 0; i < 2; i++) {
            if (i >= uSS || j >= uSS) continue;
            ivec2 p = px * uSS + ivec2(i, j);
            float v = L(uHi, hs, p);
            if (v < -1.5) { ok = false; } else acc += colAt(uHi, hs, p, v);
        }
        if (ok) { col = acc / float(uSS * uSS); useLow = false; }
    }
    if (useLow) {
        ivec2 ls = ivec2(uLowSize);
        vec2 p = gl_FragCoord.xy / uOutSize * uLowSize - 0.5;
        ivec2 i0 = ivec2(floor(p)); vec2 f = fract(p);
        vec3 c00 = colAt(uLow, ls, i0, L(uLow, ls, i0));
        vec3 c10 = colAt(uLow, ls, i0 + ivec2(1, 0), L(uLow, ls, i0 + ivec2(1, 0)));
        vec3 c01 = colAt(uLow, ls, i0 + ivec2(0, 1), L(uLow, ls, i0 + ivec2(0, 1)));
        vec3 c11 = colAt(uLow, ls, i0 + ivec2(1, 1), L(uLow, ls, i0 + ivec2(1, 1)));
        col = mix(mix(c00, c10, f.x), mix(c01, c11, f.x), f.y);
    }
    vec2 uv = gl_FragCoord.xy / uOutSize - 0.5;
    col *= 1.0 - 0.32 * dot(uv, uv) * 1.6;
    col += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
    o = vec4(col, 1.0);
}`;

function compile(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
}
function program(fs, names) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}; names.forEach((n) => (u[n] = gl.getUniformLocation(p, n)));
    return { p, u };
}
let PI, PC;
try {
    PI = program(FS_ITER, ['uOrbit', 'uRes', 'uOffPix', 'uS', 'uMaxIter', 'uRefLen', 'uProbe']);
    PC = program(FS_COLOR, ['uLow', 'uHi', 'uOutSize', 'uLowSize', 'uHiSize', 'uSS', 'uHiOn', 'uPA', 'uPB', 'uPC', 'uPD', 'uInside', 'uDens', 'uShift', 'uRel']);
} catch (e) { console.error(e); fail('Die Shader konnten nicht kompiliert werden.'); return; }

function makeTarget(w, h, internal, format, type) {
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fbo, w, h, ok };
}
function freeTarget(t) { if (t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); } }

const orbitTex = gl.createTexture();
function uploadOrbit(o) {
    const W = 2048, rows = Math.max(1, Math.ceil(o.len / W));
    const data = new Float32Array(rows * W * 2); data.set(o.data.subarray(0, o.len * 2));
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, orbitTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG32F, W, rows, 0, gl.RG, gl.FLOAT, data);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

/* ------------------------------------------------------------------ *
 *  Ansicht / Referenz
 * ------------------------------------------------------------------ */
let CW = 1, CH = 1;            // Canvas in Gerätepixeln
let cssW = 1, cssH = 1;
const baseH = () => Math.max(3.0, 3.2 * CH / CW);
const viewH = () => baseH() / S.zoom;
const maxIter = () => Math.max(120, Math.min(MAXIT, Math.round((220 + 105 * Math.log2(Math.max(S.zoom, 1))) * S.det)));
const capFor = (it) => Math.min(MAXIT + 64, Math.ceil(it * 1.25) + 48);
const bitsFor = (z) => Math.max(96, Math.min(FS, Math.ceil(Math.log2(Math.max(z, 1))) + 80));
const center256 = () => [S.ref[0] + dblToFixed(S.off[0]), S.ref[1] + dblToFixed(S.off[1])];

function setReference(c, zoomForBits, cap) {
    const F = bitsFor(zoomForBits), sh = BigInt(FS - F);
    const rx = c[0] >> sh, ry = c[1] >> sh;
    const o = buildOrbit(rx, ry, F, cap);
    S.ref = [rx << sh, ry << sh]; S.refBits = F; S.orbitCap = cap; S.orbitLen = o.len;
    uploadOrbit(o);
}
function reRef(c, zoomForBits, cap) {
    setReference(c, zoomForBits, cap);
    S.off = [Number(c[0] - S.ref[0]) * P256, Number(c[1] - S.ref[1]) * P256];
}
function ensureRef() {
    if (S.lockRef) return;      // während eines Flugs bleibt die Referenz fest
    const mi = maxIter(), vh = viewH();
    const far = Math.max(Math.abs(S.off[0]), Math.abs(S.off[1])) > 0.7 * vh;
    const short = S.orbitLen > S.orbitCap && mi + 4 > S.orbitCap;      // Referenz entkommt nie, aber Bahn zu kurz
    const bits = bitsFor(S.zoom) > S.refBits + 12;
    if (far || short || bits) reRef(center256(), S.zoom, capFor(mi));
}

/* ------------------------------------------------------------------ *
 *  Render-Ziele und Durchgänge

/* ------------------------------------------------------------------ *
 *  Hauptschleife

// Testzugang für automatische Prüfungen
window.__jbf = {
    S, get hiValid() { return hiValid; }, get refine() { return !!refine; },
    center256, setView(re, im, z) { stopFlight(); S.zoom = z; reRef([decToFixed(re), decToFixed(im)], z, capFor(Math.min(MAXIT, Math.round((220 + 105 * Math.log2(Math.max(z, 1))) * S.det)))); touchView(); },
    moveRef(dx, dy) { const c = center256(); reRef([c[0] + dblToFixed(dx), c[1] + dblToFixed(dy)], S.zoom, capFor(maxIter())); S.off = [Number(c[0] - S.ref[0]) * P256, Number(c[1] - S.ref[1]) * P256]; touchView(); },
    maxIter, flyTo, goto(i, m) { const t = TARGETS[i]; this.setView(t.re, t.im, t.zoom * m); if (t.pal !== undefined) setPalette(t.pal); }
};
})();

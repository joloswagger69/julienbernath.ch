<style>
    .page { max-width: 1280px; margin: 0 auto; }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-bottom: 14px; }

    .tabs button { padding: 9px 14px; font-weight: 600; font-size: .92rem; }
    .tabs button + button { border-left: 1px solid var(--line-strong); }
    .tabs button[aria-pressed="true"] { background: var(--ink); color: var(--base); }
    .tm { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 260px; }
    .tm input { flex: 1; min-width: 120px; }
    .tm output { min-width: 9ch; text-align: right; font-size: .9rem; color: var(--ink-soft); }
    .mapwrap { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
    #map { display: block; width: 100%; height: auto; cursor: default; touch-action: manipulation; }
    #map.hot { cursor: pointer; }

    .cities { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 12px; margin-top: 16px; }
    .city { position: relative; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line-strong)); border-radius: 4px; padding: 12px 14px 12px; cursor: pointer; transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s; outline-offset: 2px; }
    .city:hover { transform: translateY(-3px); box-shadow: 5px 5px 0 var(--c, var(--line-strong)); border-color: var(--ink); }
    .city.sel { border-color: var(--ink); box-shadow: 5px 5px 0 var(--red); }
    .city.home { --c: var(--red); }
    .city h3 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; font-size: 1.15rem; font-weight: 800; font-variation-settings: "wdth" 80; line-height: 1.15; }
    .city h3 small { font-size: .78rem; font-weight: 500; color: var(--muted); font-variation-settings: "wdth" 100; }
    .city .ok { margin-left: auto; color: #1a8f4c; font-size: .78rem; font-weight: 700; }
    .city .t { font-size: 2.15rem; font-weight: 500; line-height: 1.15; margin-top: 6px; letter-spacing: .01em; }
    .city .t i { font-style: normal; font-size: .52em; color: var(--muted); margin-left: 2px; }
    .city .d { font-size: .84rem; color: var(--muted); margin-top: 2px; }
    .city .s { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: .85rem; color: var(--ink-soft); flex-wrap: wrap; }
    .city .s .st { font-weight: 700; }
    .ic { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid var(--ink); background: var(--ic, transparent); }
    .ic.day { background: #F5C44A; border-color: #b78a12; box-shadow: 0 0 0 3px rgba(245,196,74,.25); }
    .ic.dusk { background: linear-gradient(90deg, #F59E4A 50%, #2a3358 50%); border-color: var(--ink); }
    .ic.night { background: #2a3358; border-color: #8aa0ff; }
    .city .sun { margin-left: auto; font-size: .8rem; color: var(--muted); }
    .strip { position: relative; height: 8px; border-radius: 2px; margin-top: 10px; background: var(--line); overflow: visible; }
    .strip b { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--red); transform: translateX(-1px); transition: left .5s linear; }
    .empty { grid-column: 1 / -1; color: var(--muted); }
    @media (max-width: 640px) { .tm { min-width: 100%; order: 3; } .city .t { font-size: 1.9rem; } .cities { grid-template-columns: 1fr 1fr; gap: 10px; } .city { padding: 10px 11px; } .city .sun { margin-left: 0; width: 100%; } }

    { id: 'pa', n: 'Patagonien', c: 'El Calafate', tz: 'America/Argentina/Rio_Gallegos', lat: -50.3375, lon: -72.2648, g: 'list' },
    { id: 'lo', n: 'Lofoten', c: 'Svolvær', tz: 'Europe/Oslo', lat: 68.2342, lon: 14.5683, g: 'list' },
    { id: 'nk', n: 'Nordkap', c: 'Nordkapp', tz: 'Europe/Oslo', lat: 71.1694, lon: 25.7840, g: 'list' },
    { id: 'az', n: 'Azoren', c: 'Ponta Delgada', tz: 'Atlantic/Azores', lat: 37.7412, lon: -25.6756, g: 'list', done: true },
    { id: 'kg', n: 'Kirgisistan', c: 'Bischkek', tz: 'Asia/Bishkek', lat: 42.8746, lon: 74.5698, g: 'list' },
    { id: 'ac', n: 'Atacama-Wüste', c: 'San Pedro', tz: 'America/Santiago', lat: -22.9087, lon: -68.1997, g: 'list' },
    { id: 'nz', n: 'Neuseeland', c: 'Auckland', tz: 'Pacific/Auckland', lat: -36.8485, lon: 174.7633, g: 'list' },
    { id: 'ak', n: 'Alaska', c: 'Anchorage', tz: 'America/Anchorage', lat: 61.2181, lon: -149.9003, g: 'list' },
    { id: 'mn', n: 'Mongolei', c: 'Ulaanbaatar', tz: 'Asia/Ulaanbaatar', lat: 47.8864, lon: 106.9057, g: 'list' },
    { id: 'aq', n: 'Antarktis', c: 'McMurdo', tz: 'Antarctica/McMurdo', lat: -77.8419, lon: 166.6863, g: 'list' },
    { id: 'utc', n: 'UTC', c: 'Greenwich', tz: 'UTC', lat: 51.4779, lon: 0.0, g: 'prak' },
    { id: 'ny', n: 'New York', c: 'USA, Ostküste', tz: 'America/New_York', lat: 40.7128, lon: -74.0060, g: 'prak' },
    { id: 'la', n: 'Los Angeles', c: 'USA, Westküste', tz: 'America/Los_Angeles', lat: 34.0522, lon: -118.2437, g: 'prak' },
    { id: 'sp', n: 'São Paulo', c: 'Brasilien', tz: 'America/Sao_Paulo', lat: -23.5505, lon: -46.6333, g: 'prak' },
    { id: 'du', n: 'Dubai', c: 'VAE', tz: 'Asia/Dubai', lat: 25.2048, lon: 55.2708, g: 'prak' },
    { id: 'mu', n: 'Mumbai', c: 'Indien', tz: 'Asia/Kolkata', lat: 19.0760, lon: 72.8777, g: 'prak' },
    { id: 'sg', n: 'Singapur', c: 'Singapur', tz: 'Asia/Singapore', lat: 1.3521, lon: 103.8198, g: 'prak' },
    { id: 'tk', n: 'Tokio', c: 'Japan', tz: 'Asia/Tokyo', lat: 35.6762, lon: 139.6503, g: 'prak' },
    { id: 'sy', n: 'Sydney', c: 'Australien', tz: 'Australia/Sydney', lat: -33.8688, lon: 151.2093, g: 'prak' }
];
const HOME = CITIES[0];

/* ---------- Zeit ---------- */
CITIES.forEach((c) => {
    const make = (tz) => ({
        full: new Intl.DateTimeFormat('de-CH', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' }),
        hm: new Intl.DateTimeFormat('de-CH', { timeZone: tz, hourCycle: 'h23', hour: '2-digit', minute: '2-digit' }),
        dd: new Intl.DateTimeFormat('de-CH', { timeZone: tz, weekday: 'short', day: 'numeric', month: 'short' })
    });
    try { c.f = make(c.tz); } catch (e) { c.f = make(c.alt || 'UTC'); }
});
function parts(c, ms) {
    const o = {}; c.f.full.formatToParts(new Date(ms)).forEach((p) => { if (p.type !== 'literal') o[p.type] = +p.value; });
    return o;
}
function wall(c, ms) {                        // lokale Wanduhr und Offset in Minuten
    const p = parts(c, ms);
    const asUtc = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
    return { p, off: Math.round((asUtc - Math.floor(ms / 1000) * 1000) / 60000) };
}

/* ---------- Sonne (NOAA-Näherung) ---------- */
function sunAt(ms) {
    const d = ms / 86400000 - 10957.5;
    const g = rad((357.529 + 0.98560028 * d) % 360), q = (280.459 + 0.98564736 * d) % 360;
    const L = rad(q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g));
    const e = rad(23.439 - 0.00000036 * d);
    const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
    const dec = Math.asin(Math.sin(e) * Math.sin(L));
    const gmst = (((18.697374558 + 24.06570982441908 * d) % 24) + 24) % 24;
    let lon = (ra * 12 / Math.PI - gmst) * 15;
    lon = ((((lon + 180) % 360) + 360) % 360) - 180;
    return { dec, lon };
}
const altOf = (lat, lon, s) => deg(Math.asin(Math.sin(rad(lat)) * Math.sin(s.dec) + Math.cos(rad(lat)) * Math.cos(s.dec) * Math.cos(rad(lon - s.lon))));
const H0 = -0.833;

const dayCache = new Map();
function dayInfo(c, ms) {
    const w = wall(c, ms), key = c.id + '|' + w.p.year + '-' + w.p.month + '-' + w.p.day;
    let r = dayCache.get(key); if (r) return r;
    const start = ms - ((w.p.hour * 60 + w.p.minute) * 60 + w.p.second) * 1000;     // lokale Mitternacht (UTC-ms)
    const N = 288, xs = new Float32Array(N + 1);
    for (let i = 0; i <= N; i++) xs[i] = altOf(c.lat, c.lon, sunAt(start + i * 300000));
    let rise = null, set = null, up = 0;
    for (let i = 0; i < N; i++) {
        if (xs[i] > H0) up++;
        const a = xs[i] - H0, b = xs[i + 1] - H0;
        if (a <= 0 && b > 0 && rise === null) rise = start + (i + (0 - a) / (b - a)) * 300000;
        if (a > 0 && b <= 0 && set === null) set = start + (i + a / (a - b)) * 300000;
    }
    r = { start, xs, rise, set, always: up === N, never: up === 0 };
    if (dayCache.size > 400) dayCache.clear();
    dayCache.set(key, r); return r;
}
function stripGradient(info) {
    const stops = [];
    for (let i = 0; i <= 48; i++) {
        const a = info.xs[Math.min(288, i * 6)];
        const t = Math.max(0, Math.min(1, (a + 18) / 24));            // -18° .. +6°
        const col = a > H0 ? `rgb(245,${190 + Math.round(30 * Math.min(1, a / 30))},${90 + Math.round(60 * Math.min(1, a / 30))})` : `rgb(${Math.round(24 + 40 * t)},${Math.round(30 + 50 * t)},${Math.round(70 + 90 * t)})`;
        stops.push(`${col} ${(i / 48 * 100).toFixed(1)}%`);
    }
    return `linear-gradient(90deg, ${stops.join(',')})`;
}
const stateOf = (a) => (a > H0 ? 'day' : a > -12 ? 'dusk' : 'night');
const STATE_TXT = { day: 'Tag', dusk: 'Dämmerung', night: 'Nacht' };

/* ---------- Zustand ---------- */
const store = {
    get(k, d) { try { const v = localStorage.getItem('jbw-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('jbw-' + k, JSON.stringify(v)); } catch (e) {} }
};
let group = store.get('g', 'list'), selId = store.get('sel', 'baden'), shiftMin = 0, hoverId = null;
if (!['list', 'prak', 'all'].includes(group)) group = 'list';
const now = () => Date.now() + shiftMin * 60000;

/* ---------- Karten-Rendering ---------- */
const cv = $('#map'), cx = cv.getContext('2d');
const land = new Path2D(LAND);
const night = document.createElement('canvas'); night.width = 360; night.height = 180;
const nx = night.getContext('2d'), nimg = nx.createImageData(360, 180);
let W = 0, Hh = 0, dpr = 1;
function size() {
    const r = cv.parentElement.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(r.width); Hh = Math.round(W / 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr); cv.style.height = Hh + 'px';
}
const cvar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const px = (lon) => (lon + 180) / 360 * W, py = (lat) => (90 - lat) / 180 * Hh;
function drawMap() {
    if (!W) return;
    const ms = now(), s = sunAt(ms), dark = getComputedStyle(document.documentElement).colorScheme.includes('dark');
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.fillStyle = cvar('--base'); cx.fillRect(0, 0, W, Hh);
    // Gitter
    cx.strokeStyle = cvar('--line'); cx.lineWidth = 1; cx.beginPath();
    for (let lon = -150; lon <= 150; lon += 30) { cx.moveTo(px(lon), 0); cx.lineTo(px(lon), Hh); }
    for (let lat = -60; lat <= 60; lat += 30) { cx.moveTo(0, py(lat)); cx.lineTo(W, py(lat)); }
    cx.stroke();
    cx.strokeStyle = cvar('--line-strong'); cx.globalAlpha = .5; cx.beginPath(); cx.moveTo(0, py(0)); cx.lineTo(W, py(0)); cx.stroke(); cx.globalAlpha = 1;
    // Land
    cx.save(); cx.scale(W / 1440, Hh / 720);
    cx.fillStyle = cvar('--panel'); cx.fill(land);
    cx.strokeStyle = cvar('--line-strong'); cx.lineWidth = 0.9 * 1440 / W; cx.globalAlpha = .55; cx.stroke(land); cx.globalAlpha = 1;
    cx.restore();
    // Nacht
    const d = nimg.data, sinD = Math.sin(s.dec), cosD = Math.cos(s.dec);
    const cH = new Float32Array(360);
    for (let x = 0; x < 360; x++) cH[x] = Math.cos(rad((x + 0.5) - 180 - s.lon));
    for (let y = 0; y < 180; y++) {
        const lat = rad(90 - (y + 0.5)), a = Math.sin(lat) * sinD, b = Math.cos(lat) * cosD;
        for (let x = 0; x < 360; x++) {
            const alt = deg(Math.asin(a + b * cH[x]));
            let t = Math.max(0, Math.min(1, (H0 - alt) / 17.2)); t = t * t * (3 - 2 * t);
            const i = (y * 360 + x) * 4;
            d[i] = dark ? 0 : 6; d[i + 1] = dark ? 4 : 12; d[i + 2] = dark ? 14 : 44; d[i + 3] = Math.round(t * (dark ? 190 : 165));
        }
    }
    nx.putImageData(nimg, 0, 0);
    cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
    cx.drawImage(night, 0, 0, W, Hh);
    // Sonne
    const sx = px(s.lon), sy = py(deg(s.dec));
    cx.fillStyle = 'rgba(245,196,74,.28)'; cx.beginPath(); cx.arc(sx, sy, 15, 0, 6.2832); cx.fill();
    cx.fillStyle = '#F5C44A'; cx.beginPath(); cx.arc(sx, sy, 6, 0, 6.2832); cx.fill();
    cx.strokeStyle = '#F5C44A'; cx.lineWidth = 1.5;
    for (let i = 0; i < 8; i++) { const an = i * Math.PI / 4; cx.beginPath(); cx.moveTo(sx + Math.cos(an) * 9, sy + Math.sin(an) * 9); cx.lineTo(sx + Math.cos(an) * 13, sy + Math.sin(an) * 13); cx.stroke(); }
    // Orte
    const vis = visible();
    const t = performance.now() / 1000;
    vis.concat(group === 'all' ? [] : [HOME]).forEach((c) => {
        const x = px(c.lon), y = py(c.lat), home = c.id === 'baden', sel = c.id === selId;
        cx.fillStyle = home ? '#E30613' : '#fff'; cx.strokeStyle = home ? '#fff' : '#111'; cx.lineWidth = 1.5;
        cx.beginPath(); cx.arc(x, y, home ? 5.5 : 4, 0, 6.2832); cx.fill(); cx.stroke();
        if (sel) { const r = 8 + 5 * ((t * 0.9) % 1); cx.strokeStyle = `rgba(227,6,19,${1 - ((t * 0.9) % 1)})`; cx.lineWidth = 2; cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.stroke(); }
    });
    const lab = CITIES.find((c) => c.id === (hoverId || selId));
    if (lab) {
        const x = px(lab.lon), y = py(lab.lat);
        cx.font = '600 12px Archivo, Arial, sans-serif';
        const txt = lab.n + ' · ' + lab.f.hm.format(new Date(ms)), w = cx.measureText(txt).width + 14;
        let bx = Math.min(W - w - 4, Math.max(4, x - w / 2)), by = y - 30; if (by < 4) by = y + 12;
        cx.fillStyle = 'rgba(12,12,12,.86)'; cx.fillRect(bx, by, w, 20);
        cx.fillStyle = '#fff'; cx.textBaseline = 'middle'; cx.fillText(txt, bx + 7, by + 10.5);
    }
}
const visible = () => CITIES.filter((c) => group === 'all' ? true : c.g === group || c.g === 'home');

/* ---------- Karten ---------- */
const box = $('#cities'), cards = new Map();
function buildCards() {
    box.innerHTML = ''; cards.clear();
    const list = visible();
    list.forEach((c) => {
        const el = document.createElement('article');
        el.className = 'city' + (c.id === 'baden' ? ' home' : ''); el.tabIndex = 0; el.dataset.id = c.id;
        el.innerHTML = `<h3>${c.n}<small>${c.c}</small>${c.done ? '<span class="ok">✓ besucht</span>' : ''}</h3>
            <div class="t tc"><span class="hm"></span><i class="ss"></i></div>
            <div class="d"></div>
            <div class="s"><span class="ic"></span><span class="st"></span><span class="sun tc"></span></div>
            <div class="strip"><b></b></div>`;
        el.addEventListener('click', () => select(c.id));
        el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(c.id); } });
        box.appendChild(el);
        cards.set(c.id, { el, hm: el.querySelector('.hm'), ss: el.querySelector('.ss'), d: el.querySelector('.d'), ic: el.querySelector('.ic'), st: el.querySelector('.st'), sun: el.querySelector('.sun'), strip: el.querySelector('.strip'), mark: el.querySelector('.strip b'), key: '' });
    });
    markSel(); updateCards();
}
function select(id) { selId = id; store.set('sel', id); markSel(); drawMap(); }
function markSel() { cards.forEach((v, id) => v.el.classList.toggle('sel', id === selId)); }
const p2 = (n) => String(n).padStart(2, '0');
function fmtOff(mins) {
    const sign = mins < 0 ? '−' : '+', a = Math.abs(mins), h = Math.floor(a / 60), m = a % 60;
    return sign + h + (m ? ':' + p2(m) : '') + ' h';
}
function updateCards() {
    const ms = now(), hw = wall(HOME, ms);
    cards.forEach((v, id) => {
        const c = CITIES.find((x) => x.id === id), w = wall(c, ms), info = dayInfo(c, ms);
        v.hm.textContent = p2(w.p.hour) + ':' + p2(w.p.minute); v.ss.textContent = p2(w.p.second);
        const diff = w.off - hw.off;
        v.d.textContent = c.f.dd.format(new Date(ms)) + (id === 'baden' ? ' · Zuhause' : ' · ' + (diff === 0 ? 'gleiche Zeit' : fmtOff(diff) + ' zu Baden'));
        const alt = altOf(c.lat, c.lon, sunAt(ms)), st = stateOf(alt);
        v.ic.className = 'ic ' + st; v.st.textContent = STATE_TXT[st];
        let sunTxt;
        if (info.always) sunTxt = 'Sonne geht nicht unter';
        else if (info.never) sunTxt = 'Polarnacht';
        else sunTxt = (info.rise ? '↑ ' + c.f.hm.format(new Date(info.rise)) : '') + (info.rise && info.set ? '  ' : '') + (info.set ? '↓ ' + c.f.hm.format(new Date(info.set)) : '');
        if (st === 'night' && Math.abs(c.lat) > 60) sunTxt = 'dunkel genug für Polarlicht  ' + sunTxt;
        v.sun.textContent = sunTxt;
        const k = c.id + info.start;
        if (v.key !== k) { v.strip.style.background = stripGradient(info); v.key = k; }
        v.mark.style.left = (((w.p.hour * 60 + w.p.minute) * 60 + w.p.second) / 864).toFixed(2) + '%';
        v.el.style.setProperty('--c', st === 'day' ? '#F5C44A' : st === 'dusk' ? '#F59E4A' : '#4a5a9a');
        if (id === 'baden') v.el.style.setProperty('--c', '#E30613');
    });
    const lab = $('#maplab'), s = sunAt(ms);
    lab.textContent = 'Sonne senkrecht über ' + Math.abs(deg(s.dec)).toFixed(1) + '° ' + (s.dec >= 0 ? 'N' : 'S') + ', ' + Math.abs(s.lon).toFixed(1) + '° ' + (s.lon >= 0 ? 'O' : 'W');
}

/* ---------- Eingabe ---------- */
$('#tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    group = b.dataset.g; store.set('g', group);
    document.querySelectorAll('#tabs button').forEach((x) => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    buildCards(); drawMap();
});
document.querySelectorAll('#tabs button').forEach((x) => x.setAttribute('aria-pressed', x.dataset.g === group ? 'true' : 'false'));
const sh = $('#shift'), shOut = $('#shiftOut');
function setShift(v) {
    shiftMin = v; sh.value = v;
    const a = Math.abs(v), h = Math.floor(a / 60), m = a % 60;
    shOut.textContent = v === 0 ? 'live' : (v < 0 ? '−' : '+') + h + ' h' + (m ? ' ' + m + ' min' : '');
    updateCards(); drawMap();
}
sh.addEventListener('input', () => setShift(+sh.value));
$('#now').addEventListener('click', () => setShift(0));
function pick(e) {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bd = 16;
    visible().forEach((c) => { const d = Math.hypot(px(c.lon) - x, py(c.lat) - y); if (d < bd) { bd = d; best = c; } });
    return best;
}
cv.addEventListener('pointermove', (e) => { const c = pick(e); const id = c ? c.id : null; if (id !== hoverId) { hoverId = id; cv.classList.toggle('hot', !!id); drawMap(); } });
cv.addEventListener('pointerleave', () => { hoverId = null; cv.classList.remove('hot'); drawMap(); });
cv.addEventListener('click', (e) => { const c = pick(e); if (c) { select(c.id); const v = cards.get(c.id); if (v) v.el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } });

new ResizeObserver(() => { size(); drawMap(); }).observe(cv.parentElement);
size(); buildCards(); drawMap();
setInterval(() => { if (!document.hidden) { updateCards(); drawMap(); } }, 1000);
window.__welt = { sunAt, altOf, wall, dayInfo, CITIES, setShift };
})();

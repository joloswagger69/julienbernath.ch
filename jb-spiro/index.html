<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JB Spiro | Spirograph</title>
<meta name="description" content="Spirograph mit Zahnrädern, Symmetrie, Leuchteffekt und Export als PNG oder SVG.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../extras.css?v=3.4">
<link rel="icon" type="image/png" href="../favicon.png">
<script src="../fehler.js?v=1" data-critical></script>
<script>try{var t=localStorage.getItem('jb2-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
    .stagebox { position: relative; width: 100%; max-width: min(100%, calc(100vh - var(--top-h) - 56px)); aspect-ratio: 1; margin: 0 auto; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); background: #0c0d10; transition: background .3s; }
    .stagebox.paper { background: #F4F4F1; }
    .stagebox canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #glow { filter: blur(7px) saturate(1.5); opacity: .95; mix-blend-mode: screen; }
    .paper #glow { display: none; }
    #gears { pointer-events: none; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 2px; font-size: .85rem; font-weight: 600; transition: background .2s, color .2s; }
    .chip:hover { background: var(--ink); color: var(--base); }
    .sl { display: grid; grid-template-columns: 1fr auto; align-items: center; row-gap: 2px; margin-bottom: 10px; }
    .sl label { font-size: .85rem; color: var(--muted); font-weight: 600; }
    .sl output { font-family: var(--mono); font-size: .82rem; color: var(--ink-soft); }
    .sl input { grid-column: 1 / -1; }
    .tgl { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--ink-soft); margin: 6px 0; }
    .col2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .panel h2 + .chips { margin-bottom: 4px; }
    .info { font-family: var(--mono); font-size: .8rem; color: var(--muted); margin-top: 8px; }
    .layout > aside { position: sticky; top: calc(var(--top-h) + 12px); max-height: calc(100vh - var(--top-h) - 24px); overflow: auto; }
    @media (max-width: 900px) { .layout > aside { position: static; max-height: none; } }
</style>
</head>
<body>
<header class="tbar">
    <a class="brand" href="../index.html" aria-label="julienbernath.ch">J<b>B</b></a>
    <h1>Spiro</h1>
    <span class="spacer"></span>
    <div class="actions">
        <button class="btn" type="button" id="rnd">Zufall</button>
        <button class="btn" type="button" id="png">PNG</button>
        <button class="btn solid" type="button" id="svg">SVG</button>
    </div>
    <a class="btn back-btn" href="../index.html#extras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Zurück<span class="long">&nbsp;zur Website</span></a>
</header>

<div class="wrap">
    <div class="layout">
        <aside>
            <div class="panel">
                <h2>Vorlagen</h2>
                <div class="chips" id="presets"></div>
            </div>
            <div class="panel">
                <h2>Zahnräder</h2>
                <div class="seg" id="mode" role="group" aria-label="Art"><button type="button" data-v="hypo" aria-pressed="true">Innen</button><button type="button" data-v="epi" aria-pressed="false">Aussen</button></div>
                <div style="height:12px"></div>
                <div id="gearSliders"></div>
                <div class="info" id="info"></div>
            </div>
            <div class="panel">
                <h2>Muster</h2>
                <div id="patSliders"></div>
            </div>
            <div class="panel">
                <h2>Look</h2>
                <div class="seg" id="bg" role="group" aria-label="Hintergrund"><button type="button" data-v="night" aria-pressed="true">Nacht</button><button type="button" data-v="paper" aria-pressed="false">Papier</button></div>
                <div style="height:12px"></div>
                <div class="col2">
                    <div class="field"><label for="h0">Farbe 1</label><input type="color" id="h0" value="#ff3b5c"></div>
                    <div class="field"><label for="h1">Farbe 2</label><input type="color" id="h1" value="#3bc9ff"></div>
                </div>
                <label class="tgl"><input type="checkbox" id="glowOn" checked> Leuchten</label>
                <label class="tgl"><input type="checkbox" id="gearOn" checked> Zahnräder zeigen</label>
                <div id="lookSliders"></div>
                <div class="btns"><button class="btn" type="button" id="redraw">Neu zeichnen</button></div>
            </div>
        </aside>
        <section class="preview">
            <div class="stagebox" id="box">
                <canvas id="glow" width="1200" height="1200"></canvas>
                <canvas id="main" width="1200" height="1200"></canvas>
                <canvas id="gears" width="1200" height="1200"></canvas>
            </div>
        </section>
    </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const SZ = 1200, C = SZ / 2, TAU = Math.PI * 2;
const main = $('#main'), glow = $('#glow'), gears = $('#gears');
const mc = main.getContext('2d'), gc = glow.getContext('2d'), rc = gears.getContext('2d');

const P = { mode: 'hypo', R: 96, r: 40, d: 70, sym: 1, layers: 2, width: 2.2, speed: 6, bg: 'night', c0: '#ff3b5c', c1: '#3bc9ff', glow: true, gear: true, spread: 60 };
const SL = {
    gear: [
        { k: 'R', label: 'Aussenring', min: 20, max: 150, step: 1, fmt: (v) => v },
        { k: 'r', label: 'Rolle', min: 2, max: 149, step: 1, fmt: (v) => v },
        { k: 'd', label: 'Stift (% der Rolle)', min: 5, max: 190, step: 1, fmt: (v) => v + ' %' }
    ],
    pat: [
        { k: 'sym', label: 'Symmetrie', min: 1, max: 12, step: 1, fmt: (v) => v + '×' },
        { k: 'layers', label: 'Ebenen', min: 1, max: 6, step: 1, fmt: (v) => v },
        { k: 'spread', label: 'Versatz der Ebenen', min: 0, max: 100, step: 1, fmt: (v) => v + ' %' }
    ],
    look: [
        { k: 'width', label: 'Linienstärke', min: 0.6, max: 8, step: 0.1, fmt: (v) => v.toFixed(1) },
        { k: 'speed', label: 'Tempo (Sekunden)', min: 1, max: 30, step: 1, fmt: (v) => v + ' s' }
    ]
};
function buildSliders(id, list) {
    const box = $(id);
    list.forEach((s) => {
        const w = document.createElement('div'); w.className = 'sl';
        w.innerHTML = `<label for="s-${s.k}">${s.label}</label><output id="o-${s.k}"></output><input type="range" id="s-${s.k}" min="${s.min}" max="${s.max}" step="${s.step}">`;
        box.appendChild(w);
        const inp = w.querySelector('input'), out = w.querySelector('output');
        const sync = () => { inp.value = P[s.k]; out.textContent = s.fmt(+P[s.k]); };
        s.sync = sync; sync();
        inp.addEventListener('input', () => { P[s.k] = +inp.value; sync(); changed(s.k); });
    });
}
buildSliders('#gearSliders', SL.gear); buildSliders('#patSliders', SL.pat); buildSliders('#lookSliders', SL.look);
const syncAll = () => Object.values(SL).flat().forEach((s) => s.sync());

const gcd = (a, b) => (b ? gcd(b, a % b) : a);
let N = 0, K = 1, scale = 1, drawn = 0, anim = true, lastT = 0, t0 = 0;
function geometry() {
    P.R = Math.round(P.R); P.r = Math.round(P.r);
    if (P.mode === 'hypo' && P.r >= P.R) P.r = P.R - 1;
    const g = gcd(P.R, P.r); K = P.r / g;
    N = Math.max(720, Math.min(90000, Math.round(900 * K)));
    const dd = P.r * P.d / 100;
    const ext = (P.mode === 'hypo' ? Math.abs(P.R - P.r) + dd : P.R + P.r + dd);
    scale = (SZ * 0.46) / Math.max(1, ext);
    $('#info').textContent = `${K} Umläufe · ${Math.round(P.R / g)}:${Math.round(P.r / g)}`;
}
function pt(i, out) {
    const th = (i / N) * TAU * K, R = P.R, r = P.r, d = r * P.d / 100;
    if (P.mode === 'hypo') { const m = R - r, q = m / r * th; out[0] = (m * Math.cos(th) + d * Math.cos(q)) * scale; out[1] = (m * Math.sin(th) - d * Math.sin(q)) * scale; }
    else { const m = R + r, q = m / r * th; out[0] = (m * Math.cos(th) - d * Math.cos(q)) * scale; out[1] = (m * Math.sin(th) - d * Math.sin(q)) * scale; }
}
/* Farbe */
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function colAt(t, layer) {                 // t in 0..1 entlang der Kurve, Ebene verschiebt die Farbe
    const a = hex(P.c0), b = hex(P.c1);
    let u = (t * 2 + layer * 0.37) % 2; if (u > 1) u = 2 - u;           // hin und zurück, ohne harte Kante
    const m = a.map((v, i) => Math.round(v + (b[i] - v) * u));
    return m;
}
function strokeStyle(rgb, paper) {
    if (!paper) return `rgb(${rgb.join(',')})`;
    const dk = rgb.map((v) => Math.round(v * 0.62));
    return `rgb(${dk.join(',')})`;
}

const A = [0, 0], B = [0, 0];
function drawRange(a, b) {
    const paper = P.bg === 'paper';
    const pts = []; for (let i = a; i <= b; i++) { pt(i % N, A); pts.push(A[0], A[1]); }
    const rows = P.layers, copies = P.sym;
    const mid = (a + b) / 2 / N;
    for (let L = 0; L < rows; L++) {
        const rgb = colAt(mid, L), style = strokeStyle(rgb, paper);
        const layerRot = (L / rows) * (TAU / copies) * (P.spread / 100);
        for (let c = 0; c < copies; c++) {
            const rot = (c / copies) * TAU + layerRot;
            const dens = Math.max(0.22, Math.min(1, 1.15 / Math.sqrt(rows * copies)));
            for (const [ctx, w, al, comp] of [[mc, P.width, paper ? 0.9 : 0.95 * dens + 0.05, paper ? 'multiply' : 'screen'], [gc, P.width * 3.4, 0.55 * dens, 'screen']]) {
                if (ctx === gc && (!P.glow || paper)) continue;
                ctx.save(); ctx.translate(C, C); ctx.rotate(rot);
                ctx.globalCompositeOperation = comp; ctx.globalAlpha = al; ctx.strokeStyle = style; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
                for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
                ctx.stroke(); ctx.restore();
            }
        }
    }
}
function clearAll() { mc.clearRect(0, 0, SZ, SZ); gc.clearRect(0, 0, SZ, SZ); }
function restart() { geometry(); clearAll(); drawn = 0; anim = true; t0 = performance.now(); lastT = t0; }
function changed(k) { if (k === 'speed') return; restart(); syncAll(); }

/* Zahnräder */
function drawGears(i) {
    rc.clearRect(0, 0, SZ, SZ);
    if (!P.gear || !anim) return;
    const th = (i / N) * TAU * K, R = P.R * scale, r = P.r * scale, d = r * P.d / 100;
    const paper = P.bg === 'paper';
    const col = paper ? 'rgba(20,20,20,.55)' : 'rgba(255,255,255,.55)';
    rc.save(); rc.translate(C, C); rc.lineWidth = 2; rc.strokeStyle = col; rc.fillStyle = col;
    rc.beginPath(); rc.arc(0, 0, R, 0, TAU); rc.setLineDash([4, 8]); rc.stroke(); rc.setLineDash([]);
    let cxp, cyp, px, py;
    if (P.mode === 'hypo') { const m = R - r; cxp = m * Math.cos(th); cyp = m * Math.sin(th); const q = (R - r) / r * th; px = cxp + d * Math.cos(q); py = cyp - d * Math.sin(q); }
    else { const m = R + r; cxp = m * Math.cos(th); cyp = m * Math.sin(th); const q = (R + r) / r * th; px = cxp - d * Math.cos(q); py = cyp - d * Math.sin(q); }
    rc.beginPath(); rc.arc(cxp, cyp, r, 0, TAU); rc.stroke();
    rc.beginPath(); rc.moveTo(cxp, cyp); rc.lineTo(px, py); rc.stroke();
    rc.fillStyle = '#E30613'; rc.beginPath(); rc.arc(px, py, 7, 0, TAU); rc.fill();
    rc.restore();
}

function frame(now) {
    requestAnimationFrame(frame);
    if (anim) {
        const dt = Math.min(64, now - lastT); lastT = now;
        const perMs = N / (P.speed * 1000);
        const to = Math.min(N, drawn + Math.max(1, Math.round(perMs * dt)));
        if (to > drawn) { drawRange(drawn, to); drawn = to; }
        drawGears(drawn);
        if (drawn >= N) { anim = false; rc.clearRect(0, 0, SZ, SZ); }
    }
}

/* Vorlagen und Zufall */
const PRESETS = [
    { n: 'Deltoid', mode: 'hypo', R: 105, r: 35, d: 100, sym: 1, layers: 1, c0: '#ff3b5c', c1: '#ffb23b' },
    { n: 'Astroid', mode: 'hypo', R: 96, r: 24, d: 90, sym: 1, layers: 2, c0: '#7a5cff', c1: '#3bd6ff' },
    { n: 'Mandala', mode: 'hypo', R: 120, r: 47, d: 85, sym: 6, layers: 2, c0: '#ff6b3b', c1: '#ff2d7a' },
    { n: 'Kristall', mode: 'epi', R: 60, r: 25, d: 120, sym: 3, layers: 3, c0: '#3bffd0', c1: '#3b7bff' },
    { n: 'Kordel', mode: 'hypo', R: 144, r: 55, d: 140, sym: 2, layers: 1, c0: '#ffe14a', c1: '#ff4a6a' },
    { n: 'Blüte', mode: 'epi', R: 48, r: 16, d: 150, sym: 5, layers: 2, c0: '#ff7ad9', c1: '#ffd93b' }
];
function apply(o) {
    Object.assign(P, o); delete P.n;
    $('#h0').value = P.c0; $('#h1').value = P.c1; setMode(P.mode, true); syncAll(); restart();
}
const pr = $('#presets');
PRESETS.forEach((o) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = o.n; b.addEventListener('click', () => apply({ ...o })); pr.appendChild(b); });
function randomize() {
    const pick = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    let R, r, k, tries = 0;
    do { R = pick(40, 140); r = pick(5, Math.max(6, R - 5)); k = r / gcd(R, r); tries++; } while ((k < 3 || k > 36) && tries < 200);
    const rnd = () => '#' + [0, 1, 2].map(() => pick(70, 255).toString(16).padStart(2, '0')).join('');
    const hue = () => { const h = Math.random() * 360; const f = (n) => { const k2 = (n + h / 30) % 12; return Math.round(255 * (0.62 - 0.38 * Math.max(-1, Math.min(k2 - 3, 9 - k2, 1)))); }; return '#' + [f(0), f(8), f(4)].map((v) => v.toString(16).padStart(2, '0')).join(''); };
    apply({ mode: Math.random() < 0.7 ? 'hypo' : 'epi', R, r: Math.min(r, R - 1), d: pick(40, 150), sym: pick(1, 8), layers: pick(1, 4), c0: hue(), c1: hue() });
}
$('#rnd').addEventListener('click', randomize);
$('#redraw').addEventListener('click', restart);

function setMode(v, silent) {
    P.mode = v; document.querySelectorAll('#mode button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === v ? 'true' : 'false'));
    if (!silent) restart();
}
$('#mode').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setMode(b.dataset.v); });
function setBg(v, silent) {
    P.bg = v; $('#box').classList.toggle('paper', v === 'paper');
    document.querySelectorAll('#bg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === v ? 'true' : 'false'));
    if (!silent) restart();
}
$('#bg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setBg(b.dataset.v); });
$('#h0').addEventListener('input', (e) => { P.c0 = e.target.value; restart(); });
$('#h1').addEventListener('input', (e) => { P.c1 = e.target.value; restart(); });
$('#glowOn').addEventListener('change', (e) => { P.glow = e.target.checked; restart(); });
$('#gearOn').addEventListener('change', (e) => { P.gear = e.target.checked; });

/* Export */
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1800); }
function save(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
function finishNow() { if (drawn < N) { drawRange(drawn, N); drawn = N; anim = false; rc.clearRect(0, 0, SZ, SZ); } }
$('#png').addEventListener('click', () => {
    finishNow();
    const o = document.createElement('canvas'); o.width = o.height = SZ; const x = o.getContext('2d');
    x.fillStyle = P.bg === 'paper' ? '#F4F4F1' : '#0c0d10'; x.fillRect(0, 0, SZ, SZ);
    if (P.glow && P.bg === 'night' && 'filter' in x) { x.save(); x.filter = 'blur(7px) saturate(1.5)'; x.globalCompositeOperation = 'screen'; x.drawImage(glow, 0, 0); x.restore(); }
    x.drawImage(main, 0, 0);
    o.toBlob((b) => { if (b) { save(b, 'jb-spiro.png'); toast('PNG gespeichert'); } else toast('Export fehlgeschlagen'); }, 'image/png');
});
$('#svg').addEventListener('click', () => {
    geometry();
    const paper = P.bg === 'paper', SEG = 60, per = Math.ceil(N / SEG), out = [];
    out.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${SZ} ${SZ}" width="${SZ}" height="${SZ}"><rect width="${SZ}" height="${SZ}" fill="${paper ? '#F4F4F1' : '#0c0d10'}"/>`);
    out.push(`<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="${P.width}" ${paper ? '' : 'style="mix-blend-mode:screen"'}>`);
    const o = [0, 0];
    for (let L = 0; L < P.layers; L++) {
        const layerRot = (L / P.layers) * (360 / P.sym) * (P.spread / 100);
        for (let c = 0; c < P.sym; c++) {
            const rot = (c / P.sym) * 360 + layerRot;
            out.push(`<g transform="translate(${C} ${C}) rotate(${rot.toFixed(3)})">`);
            for (let s = 0; s < SEG; s++) {
                const a = s * per, b = Math.min(N, (s + 1) * per); if (a >= b) break;
                let d = '';
                for (let i = a; i <= b; i++) { pt(i % N, o); d += (i === a ? 'M' : 'L') + o[0].toFixed(1) + ' ' + o[1].toFixed(1); }
                const rgb = colAt((a + b) / 2 / N, L);
                out.push(`<path d="${d}" stroke="${strokeStyle(rgb, paper)}" opacity="${paper ? 0.85 : 0.9}"/>`);
            }
            out.push('</g>');
        }
    }
    out.push('</g></svg>');
    save(new Blob([out.join('')], { type: 'image/svg+xml' }), 'jb-spiro.svg'); toast('SVG gespeichert');
});

apply(PRESETS[2]);
requestAnimationFrame(frame);
window.__spiro = { P, restart, finishNow, get N() { return N; }, get K() { return K; }, get drawn() { return drawn; } };
})();
</script>
</body>
</html>

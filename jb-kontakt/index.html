<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JB Kontaktbogen | Fotoauswahl wie früher</title>
<meta name="description" content="Fotos als Kontaktbogen im Filmstreifen-Look anordnen, Favoriten mit Fettstift markieren und als Bild exportieren.">
<script src="../fehler.js?v=1" data-critical></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../extras.css?v=3.4">
<link rel="icon" type="image/png" href="../favicon.png">
<script>try{var t=localStorage.getItem('jb2-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
    .sheet { background: #0b0b0a; border-radius: 6px; padding: 12px; min-height: 360px; display: grid; place-items: center; }
    #cv { display: block; width: 100%; height: auto; cursor: crosshair; }
    .sheet .drop { width: min(420px, 90%); color: #aaa; border-color: #555; }
    .sheet .drop strong { color: #fff; }
    .count { font-family: var(--mono); font-size: .85rem; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<header class="tbar">
    <a class="brand" href="../index.html" aria-label="julienbernath.ch">J<b>B</b></a>
    <h1>Kontaktbogen</h1>
    <span class="spacer"></span>
    <div class="actions">
        <button class="btn" id="add" type="button">Fotos hinzufügen</button>
        <button class="btn solid" id="dl" type="button">Als PNG speichern</button>
    </div>
    <a class="btn back-btn" href="../index.html#extras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Zurück<span class="long">&nbsp;zur Website</span></a>
</header>

<div class="wrap layout">
    <div>
        <div class="panel">
            <h2>Bogen</h2>
            <div class="field"><label for="title">Titel</label><input id="title" type="text" value="Matchday, Auswahl"></div>
            <div class="field"><label for="cols">Bilder pro Streifen: <b id="colsVal">5</b></label><input id="cols" type="range" min="3" max="8" value="5"></div>
            <div class="field"><span class="lbl">Format</span>
                <div class="seg" id="fmt"><button type="button" data-v="1.5" aria-pressed="true">3:2</button><button type="button" data-v="1" aria-pressed="false">1:1</button><button type="button" data-v="0.8" aria-pressed="false">4:5</button></div>
            </div>
            <div class="field"><label for="stock">Film-Aufdruck</label><input id="stock" type="text" value="JB 400"></div>
        </div>
        <div class="panel">
            <h2>Markieren</h2>
            <p class="note">Klick auf ein Bild = roter Kreis (Favorit). Nochmal = Kreuz (raus). Nochmal = nichts.</p>
            <div class="btns" style="margin-top:10px"><button class="btn" id="clearMarks" type="button">Markierungen löschen</button><button class="btn" id="clearAll" type="button">Alles leeren</button></div>
            <p class="count" id="count"></p>
        </div>
    </div>
    <div class="sheet preview" id="sheet">
        <label class="drop" id="drop"><input id="file" type="file" accept="image/*" multiple hidden><strong>Fotos wählen</strong><span>mehrere auf einmal, oder hierher ziehen</span></label>
        <canvas id="cv" hidden></canvas>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
    const $ = (s) => document.querySelector(s);
    const cv = $('#cv'), ctx = cv.getContext('2d');
    const photos = []; // { img, name, mark: 0|1|2, seed }
    let cells = [];
    const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1600); };
    const W = 2400;

    async function add(files) {
        const list = [...files].filter(f => f.type.startsWith('image/'));
        for (const f of list) {
            const img = await new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = URL.createObjectURL(f); });
            if (img) photos.push({ img, name: f.name.replace(/\.[^.]+$/, ''), mark: 0, seed: Math.random() * 1000 });
        }
        if (photos.length) { $('#drop').hidden = true; cv.hidden = false; }
        draw();
    }

    // Unregelmässiger "Fettstift"-Strich
    function grease(cx, cy, rx, ry, seed) {
        ctx.save();
        ctx.strokeStyle = 'rgba(227, 6, 19, .92)'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        for (let a = 0; a <= Math.PI * 2.15; a += 0.08) {
            const wob = 1 + Math.sin(a * 3 + seed) * 0.04 + Math.sin(a * 7 + seed * 2) * 0.02;
            const x = cx + Math.cos(a - 0.4) * rx * wob, y = cy + Math.sin(a - 0.4) * ry * wob * (1 + a * 0.012);
            a === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke(); ctx.restore();
    }
    function cross(x, y, w, h) {
        ctx.save(); ctx.strokeStyle = 'rgba(227, 6, 19, .9)'; ctx.lineWidth = 10; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x + w * 0.2, y + h * 0.2); ctx.lineTo(x + w * 0.8, y + h * 0.8); ctx.moveTo(x + w * 0.8, y + h * 0.22); ctx.lineTo(x + w * 0.22, y + h * 0.78); ctx.stroke(); ctx.restore();
    }

    function draw() {
        const cols = Number($('#cols').value), ar = Number($('#fmt [aria-pressed="true"]').dataset.v);
        const margin = 60, gap = 14, holeH = 46;
        const fw = (W - margin * 2 - gap * (cols - 1)) / cols, fh = fw / ar;
        const rows = Math.max(1, Math.ceil(photos.length / cols));
        const stripH = fh + holeH * 2 + 40;
        const H = 150 + rows * (stripH + 30) + 60;
        cv.width = W; cv.height = H;
        ctx.fillStyle = '#0b0b0a'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#EDEDE8'; ctx.font = '800 condensed 64px Archivo, Arial Narrow, sans-serif';
        ctx.fillText($('#title').value || 'Kontaktbogen', margin, 100);
        ctx.font = '400 26px IBM Plex Mono, monospace'; ctx.fillStyle = '#8d8e87'; ctx.textAlign = 'right';
        ctx.fillText(`${new Date().toLocaleDateString('de-CH')}   ${photos.length} Bilder   julienbernath.ch`, W - margin, 100);
        ctx.textAlign = 'left';
        cells = [];
        for (let r = 0; r < rows; r++) {
            const sy = 150 + r * (stripH + 30);
            // Filmstreifen
            ctx.fillStyle = '#1c1b18'; ctx.fillRect(margin - 30, sy, W - (margin - 30) * 2, stripH);
            ctx.fillStyle = '#0b0b0a';
            for (let x = margin - 10; x < W - margin + 10; x += 46) { ctx.fillRect(x, sy + 12, 24, 20); ctx.fillRect(x, sy + stripH - 32, 24, 20); }
            ctx.fillStyle = '#E3A93F'; ctx.font = '500 22px IBM Plex Mono, monospace';
            ctx.fillText(`${$('#stock').value}  ▸`, margin, sy + holeH - 2 + 4);
            for (let c = 0; c < cols; c++) {
                const i = r * cols + c;
                if (i >= photos.length) break;
                const p = photos[i], x = margin + c * (fw + gap), y = sy + holeH + 10;
                ctx.save(); ctx.beginPath(); ctx.rect(x, y, fw, fh); ctx.clip();
                const s = Math.max(fw / p.img.width, fh / p.img.height);
                ctx.drawImage(p.img, x + (fw - p.img.width * s) / 2, y + (fh - p.img.height * s) / 2, p.img.width * s, p.img.height * s);
                ctx.restore();
                if (p.mark === 2) { ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(x, y, fw, fh); }
                ctx.fillStyle = '#E3A93F'; ctx.font = '500 22px IBM Plex Mono, monospace';
                ctx.fillText(`${i + 1}${i % 2 ? 'A' : ''}`, x + 4, y + fh + 28);
                ctx.fillStyle = '#8d8e87'; ctx.textAlign = 'right';
                ctx.fillText(p.name.slice(0, 22), x + fw - 4, y + fh + 28); ctx.textAlign = 'left';
                if (p.mark === 1) grease(x + fw / 2, y + fh / 2, fw * 0.53, fh * 0.55, p.seed);
                if (p.mark === 2) cross(x, y, fw, fh);
                cells.push({ i, x, y, w: fw, h: fh });
            }
        }
        const fav = photos.filter(p => p.mark === 1).length, out = photos.filter(p => p.mark === 2).length;
        $('#count').textContent = photos.length ? `${photos.length} Bilder, ${fav} Favoriten, ${out} raus` : '';
    }

    cv.addEventListener('click', (e) => {
        const r = cv.getBoundingClientRect(), k = cv.width / r.width;
        const x = (e.clientX - r.left) * k, y = (e.clientY - r.top) * k;
        const cell = cells.find(c => x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h);
        if (cell) { const p = photos[cell.i]; p.mark = (p.mark + 1) % 3; p.seed = Math.random() * 1000; draw(); }
    });
    $('#cols').addEventListener('input', () => { $('#colsVal').textContent = $('#cols').value; draw(); });
    $('#title').addEventListener('input', draw); $('#stock').addEventListener('input', draw);
    $('#fmt').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; [...$('#fmt').children].forEach(x => x.setAttribute('aria-pressed', String(x === b))); draw(); });
    $('#clearMarks').addEventListener('click', () => { photos.forEach(p => p.mark = 0); draw(); });
    $('#clearAll').addEventListener('click', () => { photos.length = 0; $('#drop').hidden = false; cv.hidden = true; draw(); });
    const picker = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/*', multiple: true, hidden: true });
    document.body.appendChild(picker);
    picker.addEventListener('change', (e) => { add(e.target.files); picker.value = ''; });
    $('#add').addEventListener('click', () => picker.click());
    $('#file').addEventListener('change', (e) => add(e.target.files));
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => { e.preventDefault(); add(e.dataTransfer.files); });
    $('#dl').addEventListener('click', () => {
        if (!photos.length) { toast('Zuerst Fotos hinzufügen'); return; }
        cv.toBlob((b) => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'kontaktbogen.png'; a.click(); toast('Kontaktbogen gespeichert'); });
    });
    draw();
})();
</script>
</body>
</html>

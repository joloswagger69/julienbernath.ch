# ==========================================================================
# Sicherheitsprüfungen für die Live-Seite (main)
#
# Läuft bei jedem Push und Pull Request auf main, einmal pro Woche und auf
# Wunsch von Hand. Veröffentlicht nichts und verändert die Website nicht.
#
#  1. Secrets: Gitleaks durchsucht die gesamte Git-Historie
#  2. Code: CodeQL (statische Analyse für JavaScript und die Workflows)
#
# Alle Actions sind auf feste Commits gepinnt; jeder Job hat nur Leserechte,
# CodeQL zusätzlich das Recht, Befunde im Tab «Security» abzulegen.
# ==========================================================================
name: Sicherheit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'   # montags 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret-Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false   # keine PR-Kommentare → kein Schreibrecht nötig

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript, actions
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

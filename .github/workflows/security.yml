# ==========================================================================
# Sicherheitsprüfungen (security/hardening)
#
# Läuft bei jedem Push und Pull Request auf main / astro-redesign, einmal pro
# Woche und auf Wunsch von Hand. Veröffentlicht nichts.
#
#  1. Abhängigkeiten: npm audit – schlägt bei "high" oder "critical" fehl
#  2. Build: die Astro-Seite muss sich fehlerfrei bauen lassen
#  3. Secrets: Gitleaks durchsucht die gesamte Git-Historie
#  4. Code: CodeQL (statische Analyse für JavaScript/TypeScript)
#
# Alle Actions sind auf feste Commits gepinnt. Jeder Job erhält nur die
# Rechte, die er braucht.
# ==========================================================================
name: Sicherheit

on:
  push:
    branches: [main, astro-redesign]
  pull_request:
    branches: [main, astro-redesign]
  schedule:
    - cron: '17 4 * * 1'   # montags 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies-and-build:
    name: Abhängigkeiten & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Installieren (exakt nach package-lock.json)
        run: npm ci
      - name: Bekannte Schwachstellen (high/critical) prüfen
        run: npm audit --audit-level=high
      - name: Herkunft der Pakete prüfen (Signaturen / Provenance)
        run: npm audit signatures
      - name: Build
        run: npx astro build

  secrets:
    name: Secret-Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false   # keine PR-Kommentare → kein Schreibrecht nötig

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript, actions
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

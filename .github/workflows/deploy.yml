# ==========================================================================
# Astro-Website bauen und auf GitHub Pages veröffentlichen
#
# STATUS: VORBEREITET, ABER INAKTIV (Phase 1)
#
# Doppelte Sicherung, damit die bisherige Live-Website unverändert bleibt:
#  1. Kein automatischer Start: Der Workflow läuft nur, wenn man ihn auf
#     GitHub unter "Actions" von Hand startet (workflow_dispatch).
#     Ein Push auf main oder astro-redesign löst NICHTS aus.
#  2. Auch bei einem Handstart wird nur GEBAUT und geprüft. Der Schritt
#     "deploy" läuft erst, wenn im Repository die Variable
#     ASTRO_DEPLOY_ENABLED = true gesetzt ist (Settings → Variables).
#
# Aktivierung erst beim Go-live (Phase 7), zusammen mit Julien:
#  - GitHub Pages: Settings → Pages → Source auf "GitHub Actions" stellen
#  - Variable ASTRO_DEPLOY_ENABLED = true setzen
#  - unten den Block "push" einkommentieren
#
# Sicherheit (security/hardening):
#  - Alle Actions sind auf einen festen Commit (SHA) gepinnt; die Versionsnummer
#    steht als Kommentar dahinter. Dependabot schlägt Updates vor.
#  - Standardrechte nur "contents: read". Schreibrechte für Pages und das
#    OIDC-Token erhält ausschliesslich der Deploy-Job.
#  - Der Checkout speichert keine Zugangsdaten im Arbeitsordner.
# ==========================================================================
name: Astro – Build & Deploy

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read

# Nie zwei Veröffentlichungen gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Abhängigkeiten auf bekannte Schwachstellen prüfen
        run: npm audit --omit=dev --audit-level=high

      - name: Installieren, bauen und Ergebnis bereitstellen
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          node-version: 24
          package-manager: npm

  deploy:
    needs: build
    if: ${{ vars.ASTRO_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

# Dependabot (security/hardening): meldet einmal pro Woche verfügbare Updates
# als Pull Request. Nichts wird automatisch übernommen oder veröffentlicht.
# Grosse Versionssprünge (major) werden nicht vorgeschlagen, damit die Website
# nicht unbemerkt umgebaut wird – Sicherheitsupdates kommen trotzdem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      fonts:
        patterns: ['@fontsource*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']

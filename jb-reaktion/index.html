<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JB Reaktion | Reaktionstest</title>
<meta name="description" content="Reaktionstest in Millisekunden mit Farbe, Ton oder Go/No-Go. Mit Statistik und persönlichem Rekord.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../extras.css?v=3.4">
<link rel="icon" type="image/png" href="../favicon.png">
<script src="../fehler.js?v=1" data-critical></script>
<script>try{var t=localStorage.getItem('jb2-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
    .grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; max-width: 1180px; margin: 0 auto; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .pad {
        position: relative; display: grid; place-items: center; text-align: center; width: 100%; min-height: min(56vh, 460px);
        border-radius: 4px; border: 2px solid var(--ink); background: var(--panel); color: var(--ink);
        user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden;
        transition: background .12s;
    }
    .pad[data-s="wait"] { background: #1c1b18; color: #fff; border-color: #1c1b18; }
    .pad[data-s="go"] { background: #2fd27a; color: #05250f; border-color: #2fd27a; }
    .pad[data-s="nogo"] { background: var(--red); color: #fff; border-color: var(--red); }
    .pad[data-s="early"] { background: #F5C44A; color: #3b2a00; border-color: #F5C44A; }
    .pad[data-s="result"] { background: var(--ink); color: var(--base); }
    .big { font-size: clamp(3.4rem, 15vw, 8.5rem); font-weight: 800; font-variation-settings: "wdth" 70; line-height: 1; letter-spacing: -.01em; }
    .big small { font-size: .32em; font-weight: 600; margin-left: 6px; opacity: .8; }
    .sub { margin-top: 10px; font-size: 1.05rem; opacity: .85; }
    .dots { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; gap: 8px; }
    .dots i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; opacity: .5; }
    .dots i.done { background: currentColor; opacity: 1; }
    .dots i.cur { opacity: 1; transform: scale(1.25); }
    .modes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .stat { padding: 10px; background: var(--base); border: 1px solid var(--line); border-radius: 3px; text-align: center; }
    .stat b { display: block; font-family: var(--mono); font-size: 1.35rem; font-weight: 500; }
    .stat span { font-size: .75rem; color: var(--muted); font-weight: 600; }
    #hist { display: block; width: 100%; height: 130px; margin-top: 12px; }
    .tags { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); font-family: var(--mono); }
    .rank { margin-top: 10px; padding: 10px 12px; background: var(--base); border: 1px solid var(--line); border-radius: 3px; font-weight: 700; }
    ol.log { list-style: none; margin-top: 10px; display: grid; gap: 4px; font-family: var(--mono); font-size: .9rem; }
    ol.log li { display: flex; justify-content: space-between; padding: 4px 8px; border-bottom: 1px solid var(--line); }
    ol.log li.bad { color: var(--red-ink); }
    .row-btn { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<header class="tbar">
    <a class="brand" href="../index.html" aria-label="julienbernath.ch">J<b>B</b></a>
    <h1>Reaktion</h1>
    <span class="spacer"></span>
    <a class="btn back-btn" href="../index.html#extras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Zurück<span class="long">&nbsp;zur Website</span></a>
</header>

<div class="wrap">
    <div class="grid">
        <div>
            <div class="modes">
                <div class="seg" id="mode" role="group" aria-label="Modus" style="flex:1;min-width:260px">
                    <button type="button" data-v="color" aria-pressed="true">Farbe</button>
                    <button type="button" data-v="sound" aria-pressed="false">Ton</button>
                    <button type="button" data-v="nogo" aria-pressed="false">Go / No-Go</button>
                </div>
            </div>
            <div class="pad" id="pad" data-s="idle" tabindex="0" role="button" aria-label="Reaktionsfläche">
                <div id="content"><div class="big">Start</div></div>
                <div class="dots" id="dots"></div>
            </div>
        </div>

        <div>
            <div class="panel">
                <h2>Serie</h2>
                <div class="stats">
                    <div class="stat"><b id="sAvg">–</b><span>Schnitt</span></div>
                    <div class="stat"><b id="sMed">–</b><span>Median</span></div>
                    <div class="stat"><b id="sBest">–</b><span>Beste</span></div>
                </div>
                <div class="rank" id="rank" hidden></div>
                <ol class="log" id="log"></ol>
            </div>
            <div class="panel">
                <h2>Verlauf</h2>
                <canvas id="hist" width="520" height="130"></canvas>
                <div class="tags"><span>100 ms</span><span>250 ms</span><span>500 ms +</span></div>
                <div class="stats">
                    <div class="stat"><b id="pBest">–</b><span>Rekord</span></div>
                    <div class="stat"><b id="pAvg">–</b><span>Gesamt</span></div>
                    <div class="stat"><b id="pN">0</b><span>Versuche</span></div>
                </div>
                <div class="row-btn"><button class="btn" type="button" id="clear">Verlauf löschen</button></div>
            </div>
        </div>
    </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const ROUNDS = 5;
const store = {
    get(k, d) { try { const v = localStorage.getItem('jbr-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('jbr-' + k, JSON.stringify(v)); } catch (e) {} }
};
let mode = store.get('mode', 'color'); if (!['color', 'sound', 'nogo'].includes(mode)) mode = 'color';
let hist = store.get('hist', []); if (!Array.isArray(hist)) hist = [];
hist = hist.filter((v) => typeof v === 'number' && v > 50 && v < 3000).slice(-300);

const pad = $('#pad'), content = $('#content'), dots = $('#dots');
let state = 'idle', timer = 0, tGo = 0, series = [], round = 0, trap = false, actx = null;

const median = (a) => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const avg = (a) => a.reduce((x, y) => x + y, 0) / a.length;
const RANKS = [[150, 'Verdächtig schnell. Frühstart?'], [200, 'Pro-Gamer-Niveau'], [250, 'Schnell'], [300, 'Solide, im Normalbereich'], [400, 'Gemütlich'], [1e9, 'Zeit für einen Kaffee']];
const rankOf = (ms) => RANKS.find((r) => ms < r[0])[1];

function setState(s, html, sub) {
    state = s; pad.dataset.s = s;
    content.innerHTML = html + (sub ? `<div class="sub">${sub}</div>` : '');
}
function paintDots() {
    dots.innerHTML = '';
    for (let i = 0; i < ROUNDS; i++) { const d = document.createElement('i'); if (i < series.length) d.className = 'done'; else if (i === series.length && state !== 'idle') d.className = 'cur'; dots.appendChild(d); }
}
function beep() {
    try {
        const AC = window.AudioContext || window.webkitAudioContext; actx = actx || new AC(); if (actx.state === 'suspended') actx.resume();
        const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.value = 0.0001;
        o.connect(g).connect(actx.destination); const t = actx.currentTime;
        g.gain.exponentialRampToValueAtTime(0.4, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18); o.start(t); o.stop(t + 0.2);
    } catch (e) {}
}
function armSound() { try { const AC = window.AudioContext || window.webkitAudioContext; actx = actx || new AC(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }

function begin() {
    clearTimeout(timer);
    paintDots();
    if (mode === 'sound') armSound();
    setState('wait', '<div class="big">Warten …</div>', mode === 'sound' ? 'Auf den Ton reagieren' : mode === 'nogo' ? 'Nur bei Grün' : 'Auf Grün reagieren');
    trap = mode === 'nogo' && Math.random() < 0.3;
    const wait = 1200 + Math.random() * 3800;
    timer = setTimeout(() => {
        requestAnimationFrame(() => {                       // Messung startet mit dem Bild, das die Farbe zeigt
            if (state !== 'wait') return;
            if (trap) { setState('nogo', '<div class="big">Stopp</div>', 'Nicht klicken'); tGo = 0; timer = setTimeout(() => { if (state === 'nogo') { trapPassed(); } }, 900 + Math.random() * 500); return; }
            if (mode === 'sound') { setState('go', '<div class="big">Jetzt</div>'); tGo = performance.now(); beep(); }
            else { setState('go', '<div class="big">Jetzt</div>'); tGo = performance.now(); }
        });
    }, wait);
}
function trapPassed() { setState('result', '<div class="big">Gut</div>', 'Richtig, nicht geklickt. Tippen für die nächste Runde'); paintDots(); }

function press(e) {
    if (e) { if (e.target.closest('button') && e.target !== pad) return; }
    if (state === 'idle' || state === 'done') { series = []; hideRank(); renderLog(); begin(); return; }
    if (state === 'early' || (state === 'result')) { begin(); return; }
    if (state === 'wait') {
        clearTimeout(timer);
        setState('early', '<div class="big">Zu früh</div>', 'Tippen und nochmals'); paintDots(); logLine('zu früh', true); return;
    }
    if (state === 'nogo') {
        clearTimeout(timer);
        setState('early', '<div class="big">Reingefallen</div>', 'Bei Rot nicht klicken. Tippen und nochmals'); paintDots(); logLine('Fehlklick', true); return;
    }
    if (state === 'go') {
        const ms = Math.round(performance.now() - tGo);
        series.push(ms); hist.push(ms); hist = hist.slice(-300); store.set('hist', hist);
        const done = series.length >= ROUNDS;
        setState('result', `<div class="big">${ms}<small>ms</small></div>`, done ? '' : 'Tippen für die nächste Runde');
        logLine(ms + ' ms'); paintDots(); stats(); drawHist();
        if (done) finish();
    }
}
function finish() {
    state = 'done'; pad.dataset.s = 'result';
    const a = Math.round(avg(series));
    const best = Math.min(...hist.slice(0, -ROUNDS).concat([Infinity]));
    const rec = Math.min(...series) < best;
    content.innerHTML = `<div class="big">${a}<small>ms Schnitt</small></div><div class="sub">${rankOf(a)}${rec ? ' · neuer Rekord' : ''}. Tippen für eine neue Serie</div>`;
    const r = $('#rank'); r.hidden = false; r.textContent = rankOf(a) + ' (Schnitt ' + a + ' ms)';
}
function hideRank() { $('#rank').hidden = true; }
function logLine(t, bad) { const li = document.createElement('li'); if (bad) li.className = 'bad'; li.innerHTML = `<span>${$('#log').children.length + 1}.</span><span>${t}</span>`; $('#log').appendChild(li); }
function renderLog() { $('#log').innerHTML = ''; $('#sAvg').textContent = $('#sMed').textContent = $('#sBest').textContent = '–'; }
function stats() {
    if (series.length) { $('#sAvg').textContent = Math.round(avg(series)); $('#sMed').textContent = Math.round(median(series)); $('#sBest').textContent = Math.min(...series); }
    $('#pBest').textContent = hist.length ? Math.min(...hist) : '–'; $('#pAvg').textContent = hist.length ? Math.round(avg(hist)) : '–'; $('#pN').textContent = hist.length;
}
function drawHist() {
    const cv = $('#hist'), c = cv.getContext('2d'), W = cv.width, H = cv.height;
    c.clearRect(0, 0, W, H);
    const cs = getComputedStyle(document.documentElement), ink = cs.getPropertyValue('--ink').trim(), line = cs.getPropertyValue('--line').trim();
    const lo = 100, hi = 500, bins = 40, counts = new Array(bins).fill(0);
    hist.forEach((v) => { const i = Math.min(bins - 1, Math.max(0, Math.floor((v - lo) / (hi - lo) * bins))); counts[i]++; });
    const mx = Math.max(1, ...counts), bw = W / bins;
    c.strokeStyle = line; c.beginPath(); c.moveTo(0, H - 0.5); c.lineTo(W, H - 0.5); c.stroke();
    counts.forEach((n, i) => { const h = n / mx * (H - 14); c.fillStyle = ink; c.globalAlpha = n ? 0.85 : 0.1; c.fillRect(i * bw + 1, H - Math.max(h, 2), bw - 2, Math.max(h, 2)); });
    c.globalAlpha = 1;
    if (hist.length) { const m = avg(hist), x = (m - lo) / (hi - lo) * W; c.fillStyle = '#E30613'; c.fillRect(Math.max(0, Math.min(W - 2, x)), 0, 2, H); }
    series.forEach((v) => { const x = (v - lo) / (hi - lo) * W; c.fillStyle = '#E30613'; c.beginPath(); c.arc(Math.max(4, Math.min(W - 4, x)), 8, 4, 0, 6.2832); c.fill(); });
}

/* Eingabe: pointerdown ist schneller als click */
pad.addEventListener('pointerdown', (e) => { e.preventDefault(); press(e); });
addEventListener('keydown', (e) => {
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat && !e.target.closest('input, select, textarea')) { if (e.target.closest('button')) return; e.preventDefault(); press(); }
});
$('#mode').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.v; store.set('mode', mode); clearTimeout(timer); series = []; hideRank(); renderLog();
    document.querySelectorAll('#mode button').forEach((x) => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    setState('idle', '<div class="big">Start</div>'); paintDots(); drawHist(); stats();
});
$('#clear').addEventListener('click', () => { hist = []; store.set('hist', hist); series = []; renderLog(); setState('idle', '<div class="big">Start</div>'); paintDots(); drawHist(); stats(); hideRank(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'wait') { clearTimeout(timer); setState('idle', '<div class="big">Start</div>'); paintDots(); } });

document.querySelectorAll('#mode button').forEach((x) => x.setAttribute('aria-pressed', x.dataset.v === mode ? 'true' : 'false'));
paintDots(); drawHist(); stats();
window.__rt = { press, get state() { return state; }, get series() { return series; }, forceGo() { clearTimeout(timer); trap = false; setState('go', '<div class="big">Jetzt</div>'); tGo = performance.now(); } };
})();
</script>
</body>
</html>
